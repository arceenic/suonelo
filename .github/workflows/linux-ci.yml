name: Linux CI

on: workflow_call

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NEXT_PUBLIC_SUONELO_PLATFORM: linux
  NEXT_TELEMETRY_DISABLED: '1'
  CARGO_INCREMENTAL: '0'
  RUST_TARGET: x86_64-unknown-linux-gnu
  RUSTC_WRAPPER: sccache

jobs:
  build:
    name: Build Linux (x86-64)
    runs-on: avrea-ubuntu-22.04-8-vcpu-16gb
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: Install native development libraries and the Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libwebkit2gtk-4.1-dev \
            libxdo-dev libayatana-appindicator3-dev libdbus-1-dev librsvg2-dev desktop-file-utils gnome-keyring dbus
          rust=$(sed -nE 's/^rust-version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' src-tauri/Cargo.toml)
          test -n "$rust"
          rustup toolchain install "$rust" --profile minimal --target "$RUST_TARGET" --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$rust" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.18.0'

      - name: Start sccache server
        run: sccache --start-server

      - name: Install locked frontend dependencies and export the UI
        run: |
          npm ci --no-audit
          npm ls --all
          npm run build -- --webpack
          npm run typecheck

      - name: Audit npm dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/cargo-deny"
          "$RUNNER_TEMP/cargo-deny/bin/cargo-deny" --manifest-path src-tauri/Cargo.toml \
            --config src-tauri/deny.linux.toml --locked --target "$RUST_TARGET" check advisories

      - name: Report repository-wide Rust formatting
        continue-on-error: true # The pre-port tree already has formatting differences.
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Validate Linux formatting, Clippy, and tests
        run: |
          rustfmt --edition 2024 --check src-tauri/src/vault/linux.rs src-tauri/src/account/linux.rs
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target "$RUST_TARGET" --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target "$RUST_TARGET"

      - name: Test against an isolated Secret Service provider
        run: |
          bash scripts/test-linux-keyring.sh --restart cargo test --manifest-path src-tauri/Cargo.toml \
            --locked --target "$RUST_TARGET" vault::linux::tests::isolated_provider_lifecycle -- --ignored --exact

      - name: Build the Linux release and Debian package
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build/source --remap-path-prefix=$RUNNER_TEMP=/build/temp --remap-path-prefix=$HOME=/build/home --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/build/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/build/rustup -C debuginfo=0"
          npm run tauri -- build --target "$RUST_TARGET" --no-bundle -- --locked
          npm run tauri -- bundle --target "$RUST_TARGET" --bundles deb

      - name: Verify and checksum the Debian package
        run: |
          git diff --exit-code HEAD -- package-lock.json src-tauri/Cargo.lock
          version=$(node -p 'require("./package.json").version')
          package="suonelo-$version-linux-x86_64.deb"
          staging="$RUNNER_TEMP/suonelo-linux-release"
          mkdir "$staging"
          cp "src-tauri/target/$RUST_TARGET/release/bundle/deb/suonelo_${version}_amd64.deb" "$staging/$package"
          python3 scripts/check-linux-package.py "$staging/$package"
          cd "$staging"
          sha256sum "$package" > "$package.sha256"
          sha256sum -c "$package.sha256"

      - name: Upload the verified Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-package
          path: ${{ runner.temp }}/suonelo-linux-release/
          if-no-files-found: error
